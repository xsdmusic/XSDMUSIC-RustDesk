name: Sync Upstream (temp)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Backup current master
        run: |
          git branch backup/pre-1.5.3-sync HEAD
          git push origin HEAD:refs/heads/backup/pre-1.5.3-sync

      - name: Merge upstream 1.5.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/rustdesk/rustdesk.git
          git fetch upstream tag 1.5.3 --no-tags
          if ! git merge 1.5.3 -X theirs -m "Sync upstream 1.5.3"; then
            echo "Resolving hbb_common submodule conflict..."
            git rm -f libs/hbb_common~1.5.3 || true
            git rm -rf libs/hbb_common 2>/dev/null || rm -rf libs/hbb_common
            git update-index --cacheinfo 160000,$(git rev-parse 1.5.3:libs/hbb_common),libs/hbb_common
            git commit -m "Sync upstream 1.5.3"
          fi
          echo "=== diff vs 1.5.3 (files fork keeps) ==="
          git diff --stat 1.5.3 HEAD | tail -10

      - name: Push
        run: git push origin HEAD:master
